spring.application.name=bitly-url-shortener
server.port=8080

# Public origin used when building short links and QR codes
app.base-url=http://localhost:8080

# File-based H2 so links survive restarts
spring.datasource.url=jdbc:h2:file:./data/bitlydb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

spring.thymeleaf.cache=false
